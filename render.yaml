# =================================================================
# ResQ IoT Emergency Monitoring & Response Platform
# Render Blueprint Configuration (render.yaml)
# =================================================================
# Use this Blueprint to deploy both Backend & Frontend on Render with 1-click.
# In Render Dashboard: Click "New +" -> "Blueprint" -> Connect your repository.

services:
  # -------------------------------------------------------------
  # ResQ Backend API & Real-Time Socket.IO Web Service
  # -------------------------------------------------------------
  - type: web
    name: resq-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: AUTO_SIMULATION
        value: "false"
      - key: DEVICE_OFFLINE_THRESHOLD_MS
        value: "60000"

  # -------------------------------------------------------------
  # ResQ Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  - type: web
    name: resq-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: resq-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: resq-backend
          property: host
